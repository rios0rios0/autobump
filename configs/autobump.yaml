# AutoBump's built-in defaults.
#
# This is the first of the four configuration layers, and the only one that is always
# present: it is compiled into the binary with `go:embed`, and the same file is served
# from `main` so an installed binary can pick up a language fix without a release.
#
#   built-in defaults -> published defaults -> your ~/.autobump.yaml -> the project's .autobump.yaml
#
# Each layer overrides only the keys it declares, so everything below is a starting
# point rather than a decision. It is NOT a template to copy: it deliberately carries no
# credentials, no `providers`, no `projects` and no `bump_branch_prefix`, because those
# are yours to set and this file is merged into every run. Start from
# `configs/autobump.example.yaml` instead.

# (optional) regenerate the files that derive from a version file -- lockfiles above all --
# so they travel in the bump commit instead of drifting until CI rejects the release.
# AutoBump owns the command; a configuration file only says whether to run it. Opt-in,
# because it starts a package manager. Set it here for every language, or per language below.
#refresh: true

# (optional) versioning mode: 'semver' (default), 'fork-dot', or 'fork-dash'.
#versioning: 'semver'

# (optional) changelog filename, relative to each project root.
#changelog_path: 'CHANGELOG.md'

# (optional) detect projects using chlog (https://github.com/luizjhonata/chlog), whose
# pending changes live as YAML fragments under '.changes/unreleased/'. Enabled by default.
#detect_chlog: false

# (optional) delete the bump branches left over by earlier runs, closing any pull request
# attached to each, before creating the branch for the current release. Enabled by default.
#cleanup_stale_branches: false

# rules for automatically detecting project languages
languages:
  # name of the language, this requires support in the code
  cs:
    extensions:
      - "cs"
    special_patterns:
      - "*\\.sln"
    version_files:
      - path: "*/*.vdproj"
        patterns: [ "(\"ProductVersion\"\\s*=\\s*\"\\d+:?)\\s*\\d+\\.\\d+\\.\\d+(\")" ]
      - path: "*/*.csproj"
        patterns:
          - "(\\s*<Version>)\\d+\\.\\d+\\.\\d+(</Version>)"
          - "(\\s*<AssemblyVersion>)\\d+\\.\\d+\\.\\d+(</AssemblyVersion>)"
          - "(\\s*<FileVersion>)\\d+\\.\\d+\\.\\d+(</FileVersion>)"

  dart:
    extensions:
      - "dart"
    special_patterns:
      - "pubspec.yaml"
    # Flutter carries a build number after the version ("1.2.3+7"), which Android
    # reads as versionCode and iOS as CFBundleVersion. Group 1 is the key, group 2
    # is the trailing whitespace and comment; the value between them is replaced by
    # AutoBump, which increments the build number rather than dropping it.
    # The "^version:" anchor at column 0 matters: every other version-shaped value
    # in a pubspec is indented (the SDK constraint, the dependency constraints).
    version_files:
      - path: "pubspec.yaml"
        patterns: [ "(?m)(^version:[ \\t]*)[^\\s#]+([ \\t]*(?:#.*)?$)" ]

  go:
    extensions:
      - "go"
    special_patterns:
      - "go.mod"
    # Go doesn't have a native version file - versions are managed through git tags.
    # However, APIs documented with Swagger (swaggo) carry the version in the
    # "@version" general-info annotation and in the generated docs artifacts.
    # A file is only updated when it exists and one of its patterns matches,
    # so plain Go projects keep the changelog-only behavior.
    version_files:
      - path: "main.go"
        patterns: [ "(?m)(^//\\s*@version\\s+)\\S+" ]
      - path: "cmd/main.go"
        patterns: [ "(?m)(^//\\s*@version\\s+)\\S+" ]
      - path: "cmd/*/main.go"
        patterns: [ "(?m)(^//\\s*@version\\s+)\\S+" ]
      - path: "docs/docs.go"
        patterns: [ "(\\bVersion:\\s*\")[^\"]*(\")" ]
      - path: "cmd/docs/docs.go"
        patterns: [ "(\\bVersion:\\s*\")[^\"]*(\")" ]
      - path: "cmd/*/docs/docs.go"
        patterns: [ "(\\bVersion:\\s*\")[^\"]*(\")" ]
      - path: "docs/swagger.json"
        patterns: [ "(?s)(\"info\":\\s*\\{.*?\"version\":\\s*\")[^\"]*(\")" ]
      - path: "cmd/docs/swagger.json"
        patterns: [ "(?s)(\"info\":\\s*\\{.*?\"version\":\\s*\")[^\"]*(\")" ]
      - path: "cmd/*/docs/swagger.json"
        patterns: [ "(?s)(\"info\":\\s*\\{.*?\"version\":\\s*\")[^\"]*(\")" ]
      - path: "docs/swagger.yaml"
        patterns: [ "(?m)(^  version:\\s*['\"]?)[^\\s'\"]+(['\"]?)" ]
      - path: "cmd/docs/swagger.yaml"
        patterns: [ "(?m)(^  version:\\s*['\"]?)[^\\s'\"]+(['\"]?)" ]
      - path: "cmd/*/docs/swagger.yaml"
        patterns: [ "(?m)(^  version:\\s*['\"]?)[^\\s'\"]+(['\"]?)" ]

  helm:
    extensions:
      - "yaml"
    special_patterns:
      - "Chart.yaml"
    version_files:
      - path: "Chart.yaml"
        patterns: ["(?m)(^version:\\s*['\"]?)[^\\s'\"]+(['\"]?)"]

  java:
    extensions:
      - "java"
    special_patterns:
      - "build.gradle"
      - "lib/build.gradle"
      - "pom.xml"
      - "settings.gradle"
    version_files:
      - path: "build.gradle"
        patterns: [ "(?m)(^\\s*version\\s*[=:]?\\s*[\"'])[^\"']+([\"'])" ]
      - path: "lib/build.gradle"
        patterns: [ "(?m)(^\\s*version\\s*[=:]?\\s*[\"'])[^\"']+([\"'])" ]
      - path: "pom.xml"
        patterns: [ "(\\s*<version>)[^<]+(</version>)" ]
      - path: "src/main/resources/application.yaml"
        patterns: [ "(\\s*version:\\s*')\\d+\\.\\d+\\.\\d+(')" ]

  python:
    # file extensions in the repository that could indicate
    #   this is a Python project
    extensions:
      - "py"
    # special files in the repository that could indicate
    #   this is a Python project
    special_patterns:
      - "pyproject.toml"
      - "setup.cfg"
      - "setup.py"
    version_files:
      - path: "{project_name}/__init__.py"
        patterns: ["(__version__\\s*=\\s*\")\\d+\\.\\d+\\.\\d+(\")"]

  terraform:
    extensions:
      - "tf"
      - "hcl"
    special_patterns:
      - "*.tf"
      - "versions.tf"
    # Terraform modules don't have a version file - versions are managed through git tags
    # version_files is intentionally omitted (same pattern as Go)

  typescript:
    extensions:
      - "ts"
    special_patterns:
      - "package.json"
      - "tsconfig.json"
      - "yarn.lock"
    version_files:
      - path: "package.json"
        patterns: ["(\\s*\"version\":\\s*\")\\d+\\.\\d+\\.\\d+(\",)"]

    # A TypeScript workspace is the one place a version bump invalidates a lockfile:
    # moving the range one package declares on its sibling changes a resolution
    # descriptor `yarn.lock` keys on, and the next `yarn install --immutable` answers
    # YN0028. Turn the refresh on here (or in your own config, or in the project's) and
    # AutoBump regenerates the lockfile inside the bump commit.
    #refresh: true
