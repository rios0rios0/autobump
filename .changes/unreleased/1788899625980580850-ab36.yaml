kind: 'Fixed'
body: 'fixed a wrapped changelog entry being torn apart by ordering or by fragment insertion: `SortChangelogEntries` reorders every contiguous run of `- ` lines in the whole document on every run, including released history, and a continuation line breaks that contiguity, so sorting a wrapped entry could reorder its bullet away from its own continuation -- exactly what corrupted the `[2.34.0]` `### Changed` section in this project''s own history. `UnwrapChangelogEntries` now joins every entry onto a single physical line across the whole file, not only `[Unreleased]`, before either ordering runs or a new release section is written, and AutoBump never wrote a wrapped line itself to begin with. The corrupted historical entry, and every other wrapped entry inherited from before this rule existed, has been corrected in this release'
