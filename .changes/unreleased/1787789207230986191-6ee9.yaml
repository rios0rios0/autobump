kind: 'Fixed'
body: 'fixed the global configuration being read out of the repository being released. The config search checked the working directory before the home one, and AutoBump normally runs with the repository it is releasing as the working directory -- a repository that may legitimately carry its own `.autobump.yaml` for per-project overrides. That file was therefore picked as the *global* config, and every setting AutoBump honours only from the operator own file was dropped with nothing to notice: the project file version_files still applied, so the bump rewrote the version files and the release looked correct. What went missing was `refresh_commands`, so the lockfile that derives from those version files was never regenerated, and the first CI job running an immutable install rejected the very release the pull request existed to validate. The operator home directory is now searched first and on its own, through gitforge `FindGlobalConfigFile`; the previous wider search is kept as a fallback, so an operator who keeps no config in their home directory -- and therefore has no operator-level settings to lose -- sees no change'
time: '2026-08-27T00:06:47.230919667Z'
