kind: 'Changed'
body: 'replaced `refresh_commands` with a boolean `refresh`. AutoBump now owns the command: a configuration says *whether* to regenerate what the version files derive, never *what to run*, and the recipes are compile-time constants of the program. That is what made the layering above possible. An argv read from configuration is an executable run with the release credentials, so a repository''s own file could never be trusted with it — and that single exception is what stopped a project''s configuration from simply overriding things the way every other layer does. Set `refresh: true` at the top level or under a language; the package manager is detected from the repository (`packageManager` first, then the lockfiles) and only JavaScript workspaces have a recipe, because nothing AutoBump rewrites elsewhere invalidates a lockfile. Yarn Classic is skipped with a warning: it has no install mode that resolves without also linking and running install scripts. An operator carrying the old key is told by name what to write instead.'
