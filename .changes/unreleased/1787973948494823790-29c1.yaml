kind: 'Removed'
body: 'removed the `local` subcommand. `autobump .` and `autobump /path/to/repo` are the single-repository form, and `autobump` with no arguments still prints help. `autobump local` is kept hidden and deprecated rather than deleted outright: without it the bare word would fall through to the root command''s positional argument and be read as a path, so the error would say that `./local` does not exist rather than that the command is gone.'
