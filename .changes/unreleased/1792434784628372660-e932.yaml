body: 'fixed the stale branch cleanup deleting branches AutoBump never created: it now selects only the bump prefix followed by a version the bumper produces (`X.Y.Z`, or the fork forms `X.Y.Z.N` and `X.Y.Z-N`), so a branch a person named under the prefix, such as `chore/bump-runner-images`, keeps its pull request open and is never deleted'
