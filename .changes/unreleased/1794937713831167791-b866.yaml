kind: 'Added'
body: 'added support for SSH host aliases: AutoBump now dials the `HostName` and `Port` an alias names in `ssh_config`, read under WSL from the Windows profile''s `.ssh/config` too, and offers the SSH agent key its `IdentityFile` names first (only that key with `IdentitiesOnly`), so a remote such as `git@github.com-work:org/repo.git` pushes with that account''s key'
