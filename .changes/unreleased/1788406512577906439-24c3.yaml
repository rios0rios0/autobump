kind: 'Fixed'
body: 'gave the operator a real veto over a repository''s refresh. The first cut of the project-layer opt-in claimed one and did not have it: the repository''s `.autobump.yaml` is folded *after* the operator''s file, and `RefreshEnabled` reads the project entry before either field on the global config, so an operator''s `refresh: false` was overwritten and then never consulted. An operator whose release host has no pnpm could not stop a repository turning the refresh on, and there is no `--skip-refresh` to fall back on. `resolveRefreshVeto` now records an explicit operator `false` separately, read from the document''s own keys rather than the decoded pointer, because only the key''s presence separates a refusal from an inherited value; `acceptRefresh` and `applyToProject` both refuse a project enable against it, at the top level and per language. Omitting the key is still not a veto -- silence leaves the repository free to enable its own refresh, which is the point of the feature. This matters most under `providers:` discovery, where the operator names an org rather than each repository and anyone who can land a config file in anything the API returns could otherwise start a package manager on the release host; the README now says so where an operator will read it before adding a providers block.'
