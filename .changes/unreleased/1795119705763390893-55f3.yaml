kind: 'Added'
body: 'added a credential fallback for the pull request API calls: when no token is configured for the forge, AutoBump now takes it from `GITHUB_TOKEN` or `GH_TOKEN`, `GITLAB_TOKEN` or `GL_TOKEN`, `AZURE_DEVOPS_EXT_PAT` or `SYSTEM_ACCESSTOKEN`, then from `gh auth token` or `az account get-access-token`, instead of skipping the pull request; the source is logged, the warning for a missing token names the forge, its setting and every source tried, and pushes over HTTPS and provider discovery still use only configured tokens'
time: '2026-11-19T20:21:45.763228245Z'
