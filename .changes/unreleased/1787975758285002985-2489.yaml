kind: 'Security'
body: 'kept the decision to run a package manager with the operator. `refresh` and `cleanup_stale_branches` are read from a repository''s own `.autobump.yaml` only when they are `false`: a project may switch either **off**, never on. Owning the argv was only half of what made `refresh_commands` untrusted — the other half is whether anything is executed at all, and a package manager resolving a lockfile still runs what the cloned repository supplies. The recipes now say so too: pnpm calls `.pnpmfile.cjs` hooks during resolution (`--ignore-pnpmfile`) and Yarn''s launcher execs whatever `yarnPath` in the project''s own `.yarnrc.yml` names (`YARN_IGNORE_PATH=1`), and no `--ignore-scripts` reaches either. The cleanup half is a bug in its own right: `--skip-cleanup` is applied before the project layer, so an enable arriving there silently overrode the flag and deleted branches the operator had asked to keep.'
