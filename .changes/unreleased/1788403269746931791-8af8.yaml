kind: 'Changed'
body: 'let a repository turn its own refresh on. `refresh: true` in the project''s own `.autobump.yaml` -- top-level or under a language -- is now honoured, where before it was warned about and dropped and only the operator''s file could enable it. A lockfile that goes stale on a version bump is a fact about that repository''s build, and the repository is the party that reliably knows it: a TypeScript workspace whose packages declare caret ranges on each other rewrites a resolution descriptor `yarn.lock` keys on, and the next `yarn install --immutable` answers YN0028 -- so the release that most needed the refresh was the one that could not ask for it, and every such repository had to be repaired by hand after the fact. The old rule treated the three restricted layers as one population; they are not. `acceptRefresh` now honours an enable from the project layer and still refuses one from the defaults fetched over the network, which is a document nobody in the room wrote. Turning the refresh *off* is unchanged and still honoured from any layer, and the operator keeps the veto: their own configuration is a later layer than the defaults. What made the old boundary necessary has not come back -- AutoBump owns the argv, and the recipes still suppress pnpm''s `.pnpmfile.cjs`, Yarn Berry''s `yarnPath` and npm''s lifecycle scripts -- so the toggle decides only whether a package manager runs, never what it runs.'
time: '2026-09-03T02:41:09.746931791Z'
