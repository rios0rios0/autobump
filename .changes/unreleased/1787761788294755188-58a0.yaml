kind: 'Fixed'
body: 'fixed a fragment created with `chlog new --breaking` releasing as a minor version. chlog stores the flag only to force a major bump when it picks the version itself and never renders a marker, while AutoBump reads the bump off the rendered Keep a Changelog lines — so the flag was read by nobody. The entry is now written as `**BREAKING CHANGE:** <body>`, and a body that already opens with a breaking-change marker — in any spelling, including a doubled one — is not given a second one'
