kind: 'Security'
body: 'stopped calling gitlab.com''s API with a GitLab CI job''s `CI_JOB_TOKEN` when the job runs on another GitLab server: AutoBump fell back to it when no `gitlab_access_token` was configured, and the GitLab API it calls is gitlab.com''s, so a self-managed runner''s job token was sent there. gitforge''s `CheckGitLabCIJobTokenServer` now decides from the job''s own `CI_SERVER_*` variables, and the job token is withheld from the API when they name another server or none is set; git operations still use it, since they send it to the remote''s own host'
time: '2026-11-20T16:21:36.083417465Z'
