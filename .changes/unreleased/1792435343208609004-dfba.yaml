kind: 'Fixed'
body: 'fixed a newly created changelog getting a `## [<nil>]` version header when the latest tag of the repository is not a semantic version, such as the four-part tags of a fork''s upstream, which made every later release of that repository fail to parse the changelog: such a tag is now skipped, as a repository without tags already was'
