kind: 'Fixed'
body: 'fixed `autobump run` leaving files behind on the machine it runs on as it moved through an organization: every cloned repository now gets one working directory holding the clone and the npm, pnpm, Yarn and corepack caches and temporary files of the lockfile refresh, and it is deleted on every outcome, a failed clone included, which used to leave its directory in the temporary directory; directories left by a killed run are swept by the next `autobump run` once they are 30 minutes old'
