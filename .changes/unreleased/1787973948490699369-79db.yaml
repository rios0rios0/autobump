kind: 'Added'
body: 'layered the configuration. AutoBump now folds four sources, each overriding only the keys its own document declares: the built-in defaults it ships with (embedded in the binary, so it knows every language it supports with no configuration and no network), the same file fetched from `main` on a best effort so a language fix reaches an installed binary without a release, the operator''s own file, and the `.autobump.yaml` inside the repository being released. Only the operator''s file may name a credential, a `providers`/`projects` list or the bump branch prefix; the other three decode through a schema that has no field for them, so those keys have nowhere to land rather than being caught by a check that has to run at the right moment.'
