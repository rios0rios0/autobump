kind: 'Fixed'
body: 'stopped resolving the global configuration from the working directory. AutoBump normally runs with the repository it is releasing as the working directory, and that repository may carry its own `.autobump.yaml` for per-project overrides — so when the operator kept no configuration in their home directory, the project''s file was adopted as the *global* one. That is not a reordered preference, it is a substitution, and three things followed from it. The project''s overrides stopped being overrides: they are meant to be layered onto the global configuration, and as the global configuration they replaced AutoBump''s published defaults for every other language along with them. `SanitizeUntrustedLanguages` never ran, so refresh commands declared by the project were honoured — they are executables run with the release credentials, and the project path strips them for exactly that reason. And the file was decoded with `KnownFields`, although a project file is allowed to be partial, so a valid project-only key aborted the release rather than being ignored. The global configuration now comes from `-c`, then the operator''s home directory, then AutoBump''s published default; a per-project `.autobump.yaml` is merged on top of it through the path that sanitizes it, and is never read as the global configuration. An operator who kept theirs in the working directory rather than in `$HOME` should name it with `-c`.'
